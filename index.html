<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-Sholick</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #authScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, #182433, #0b0f14 55%);
    }

    .authBox {
      width: 100%;
      max-width: 400px;
      background: #111820;
      border: 1px solid #26313d;
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 20px 70px rgba(0,0,0,.4);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8d99a6;
      margin-bottom: 28px;
    }

    .authBox input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      background: #0b1016;
      border: 1px solid #293541;
      color: white;
      border-radius: 12px;
      outline: none;
    }

    .authBox input:focus {
      border-color: #4d9cff;
    }

    .primary {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 12px;
      background: #347cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .secondary {
      width: 100%;
      border: 1px solid #303c48;
      padding: 13px;
      border-radius: 12px;
      background: transparent;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    #authMessage {
      min-height: 20px;
      color: #ff7272;
      font-size: 14px;
      text-align: center;
      margin-top: 14px;
    }

    /* APP */

    #app {
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 310px;
      background: #10161d;
      border-right: 1px solid #26313d;
      display: flex;
      flex-direction: column;
    }

    .sideHeader {
      padding: 20px;
      border-bottom: 1px solid #26313d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sideHeader h1 {
      font-size: 22px;
    }

    .logout {
      border: 0;
      background: transparent;
      color: #ff7070;
      cursor: pointer;
    }

    .myName {
      padding: 14px 20px;
      color: #8f9ba8;
      font-size: 13px;
      border-bottom: 1px solid #1f2933;
    }

    .friendsTitle {
      padding: 18px 20px 10px;
      color: #8793a0;
      font-size: 13px;
      text-transform: uppercase;
    }

    #usersList {
      overflow-y: auto;
      flex: 1;
    }

    .userItem {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: .15s;
    }

    .userItem:hover,
    .userItem.active {
      background: #19222c;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #347cff, #7a4dff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .userInfo {
      min-width: 0;
    }

    .userInfo strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .online {
      color: #53dc88;
      font-size: 12px;
      margin-top: 3px;
    }

    .offline {
      color: #697580;
      font-size: 12px;
      margin-top: 3px;
    }

    /* CHAT */

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chatHeader {
      height: 74px;
      border-bottom: 1px solid #26313d;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 12px;
      background: #10161d;
    }

    #chatName {
      font-size: 17px;
    }

    #chatStatus {
      font-size: 12px;
      color: #697580;
      margin-top: 3px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: #6e7a86;
    }

    .message {
      max-width: min(70%, 600px);
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.mine {
      align-self: flex-end;
      background: #347cff;
      border-bottom-right-radius: 4px;
    }

    .message.theirs {
      align-self: flex-start;
      background: #202a34;
      border-bottom-left-radius: 4px;
    }

    .messageTime {
      display: block;
      font-size: 10px;
      opacity: .65;
      margin-top: 4px;
      text-align: right;
    }

    .composer {
      padding: 15px;
      border-top: 1px solid #26313d;
      background: #10161d;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #2b3743;
      background: #0b1016;
      color: white;
      border-radius: 14px;
      padding: 13px 15px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #347cff;
    }

    #sendButton {
      width: 50px;
      border: 0;
      border-radius: 14px;
      background: #347cff;
      color: white;
      cursor: pointer;
      font-size: 20px;
    }

    #sendButton:disabled {
      opacity: .35;
      cursor: default;
    }

    .mobileBack {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
      }

      .chat {
        display: none;
      }

      #app.chatOpen .sidebar {
        display: none;
      }

      #app.chatOpen .chat {
        display: flex;
      }

      .mobileBack {
        display: block;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="authScreen">

  <div class="authBox">

    <div class="logo">T-Sholick</div>

    <div class="subtitle">
      Arkadaşlarınla özel olarak sohbet et.
    </div>

    <input
      id="email"
      type="email"
      placeholder="E-posta"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Şifre"
      autocomplete="current-password"
    >

    <input
      id="username"
      type="text"
      placeholder="Kullanıcı adı (kayıt olurken)"
      maxlength="20"
    >

    <button class="primary" id="registerButton">
      Hesap oluştur
    </button>

    <button class="secondary" id="loginButton">
      Giriş yap
    </button>

    <div id="authMessage"></div>

  </div>
</div>


<!-- CHAT APP -->
<div id="app" class="hidden">

  <aside class="sidebar">

    <div class="sideHeader">
      <h1>T-Sholick</h1>
      <button class="logout" id="logoutButton">
        Çıkış
      </button>
    </div>

    <div class="myName" id="myName">
      Kullanıcı
    </div>

    <div class="friendsTitle">
      Arkadaşlar
    </div>

    <div id="usersList"></div>

  </aside>


  <main class="chat">

    <div class="chatHeader">

      <button class="mobileBack" id="backButton">
        ←
      </button>

      <div class="avatar" id="chatAvatar">
        ?
      </div>

      <div>
        <div id="chatName">
          Bir arkadaş seç
        </div>

        <div id="chatStatus">
          Sohbet başlatmak için arkadaş seç.
        </div>
      </div>

    </div>


    <div id="messages">

      <div class="empty">
        Soldan bir arkadaş seçerek sohbete başla 💬
      </div>

    </div>


    <div class="composer">

      <input
        id="messageInput"
        type="text"
        placeholder="Mesaj yaz..."
        autocomplete="off"
        disabled
      >

      <button id="sendButton" disabled>
        ➤
      </button>

    </div>

  </main>

</div>


<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    set,
    push,
    onValue
  } from
    "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


  /* FIREBASE */

  const firebaseConfig = {
    apiKey: "AIzaSyDW_5z_vOGLdXY2vZ1BtSegVXXSud6Mqo8",
    authDomain: "t-sholick.firebaseapp.com",
    databaseURL: "https://t-sholick-default-rtdb.firebaseio.com",
    projectId: "t-sholick",
    storageBucket: "t-sholick.firebasestorage.app",
    messagingSenderId: "903414311425",
    appId: "1:903414311425:web:16e66918d4ad7cf6412e00",
    measurementId: "G-X9Y2GWSJHG"
  };


  const appFirebase = initializeApp(firebaseConfig);

  const auth = getAuth(appFirebase);

  const db = getDatabase(appFirebase);


  /* ELEMENTS */

  const authScreen = document.getElementById("authScreen");
  const appScreen = document.getElementById("app");

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const usernameInput = document.getElementById("username");

  const authMessage = document.getElementById("authMessage");

  const usersList = document.getElementById("usersList");

  const myName = document.getElementById("myName");

  const chatName = document.getElementById("chatName");
  const chatStatus = document.getElementById("chatStatus");
  const chatAvatar = document.getElementById("chatAvatar");

  const messages = document.getElementById("messages");

  const messageInput = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");

  const logoutButton = document.getElementById("logoutButton");

  const backButton = document.getElementById("backButton");

  let currentUser = null;
  let currentChatUser = null;
  let unsubscribeMessages = null;


  /* HATA */

  function showError(error) {

    console.error(error);

    const errors = {
      "auth/email-already-in-use":
        "Bu e-posta zaten kayıtlı.",

      "auth/invalid-email":
        "Geçersiz e-posta adresi.",

      "auth/weak-password":
        "Şifre en az 6 karakter olmalı.",

      "auth/invalid-credential":
        "E-posta veya şifre yanlış.",

      "auth/invalid-login-credentials":
        "E-posta veya şifre yanlış."
    };

    authMessage.textContent =
      errors[error.code] ||
      "Bir hata oluştu. Tekrar dene.";
  }


  /* REGISTER */

  document
    .getElementById("registerButton")
    .addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const username = usernameInput.value.trim();

      if (!email || !password || !username) {
        authMessage.textContent =
          "E-posta, şifre ve kullanıcı adı gerekli.";
        return;
      }

      if (username.length < 3) {
        authMessage.textContent =
          "Kullanıcı adı en az 3 karakter olmalı.";
        return;
      }

      try {

        authMessage.textContent =
          "Hesap oluşturuluyor...";

        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user = result.user;

        await set(
          ref(db, "users/" + user.uid),
          {
            username: username,
            email: email,
            createdAt: Date.now(),
            online: true
          }
        );

        authMessage.textContent = "";

      } catch (error) {

        showError(error);

      }

    });


  /* LOGIN */

  document
    .getElementById("loginButton")
    .addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        authMessage.textContent =
          "E-posta ve şifre gerekli.";
        return;
      }

      try {

        authMessage.textContent =
          "Giriş yapılıyor...";

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        authMessage.textContent = "";

      } catch (error) {

        showError(error);

      }

    });


  /* LOGOUT */

  logoutButton.addEventListener(
    "click",
    async () => {

      if (currentUser) {

        await set(
          ref(db, "users/" + currentUser.uid + "/online"),
          false
        );

      }

      await signOut(auth);

    }
  );


  /* AUTH STATE */

  onAuthStateChanged(
    auth,
    async (user) => {

      currentUser = user;

      if (!user) {

        authScreen.classList.remove("hidden");
        appScreen.classList.add("hidden");

        return;
      }

      authScreen.classList.add("hidden");
      appScreen.classList.remove("hidden");

      await set(
        ref(db, "users/" + user.uid + "/online"),
        true
      );

      loadMyProfile();
      loadUsers();

    }
  );


  /* MY PROFILE */

  function loadMyProfile() {

    onValue(
      ref(db, "users/" + currentUser.uid),
      snapshot => {

        const data = snapshot.val();

        if (data) {

          myName.textContent =
            "Sen: " + data.username;

        }

      }
    );

  }


  /* USERS */

  function loadUsers() {

    onValue(
      ref(db, "users"),
      snapshot => {

        usersList.innerHTML = "";

        const users = snapshot.val() || {};

        Object
          .entries(users)
          .forEach(([uid, user]) => {

            if (uid === currentUser.uid) {
              return;
            }

            const item =
              document.createElement("div");

            item.className = "userItem";

            item.innerHTML = `
              <div class="avatar">
                ${(user.username || "?")
                  .charAt(0)
                  .toUpperCase()}
              </div>

              <div class="userInfo">

                <strong>
                  ${escapeHtml(user.username || "Kullanıcı")}
                </strong>

                <div class="${user.online ? "online" : "offline"}">
                  ${user.online ? "● Çevrimiçi" : "Çevrimdışı"}
                </div>

              </div>
            `;

            item.addEventListener(
              "click",
              () => openChat(uid, user)
            );

            usersList.appendChild(item);

          });

      }
    );

  }


  /* OPEN CHAT */

  function openChat(uid, user) {

    currentChatUser = {
      uid: uid,
      ...user
    };

    chatName.textContent =
      user.username || "Kullanıcı";

    chatStatus.textContent =
      user.online
        ? "● Çevrimiçi"
        : "Çevrimdışı";

    chatStatus.style.color =
      user.online
        ? "#53dc88"
        : "#697580";

    chatAvatar.textContent =
      (user.username || "?")
        .charAt(0)
        .toUpperCase();

    messageInput.disabled = false;
    sendButton.disabled = false;

    messages.innerHTML = "";

    appScreen.classList.add("chatOpen");

    listenMessages();

  }


  /* CHAT LISTENER */

  function listenMessages() {

    if (unsubscribeMessages) {
      unsubscribeMessages();
    }

    const ids = [
      currentUser.uid,
      currentChatUser.uid
    ].sort();

    const chatId =
      ids[0] + "_" + ids[1];

    const chatRef =
      ref(db, "chats/" + chatId + "/messages");

    unsubscribeMessages =
      onValue(chatRef, snapshot => {

        messages.innerHTML = "";

        const data =
          snapshot.val() || {};

        const list =
          Object.values(data)
            .sort((a, b) =>
              (a.timestamp || 0) -
              (b.timestamp || 0)
            );

        if (list.length === 0) {

          messages.innerHTML = `
            <div class="empty">
              Henüz mesaj yok.<br>
              İlk mesajı sen gönder 👋
            </div>
          `;

          return;
        }

        list.forEach(message => {

          const bubble =
            document.createElement("div");

          bubble.className =
            "message " +
            (
              message.senderId === currentUser.uid
                ? "mine"
                : "theirs"
            );

          const time =
            new Date(
              message.timestamp || Date.now()
            )
            .toLocaleTimeString(
              "tr-TR",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            );

          bubble.innerHTML = `
            ${escapeHtml(message.text)}
            <span class="messageTime">
              ${time}
            </span>
          `;

          messages.appendChild(bubble);

        });

        messages.scrollTop =
          messages.scrollHeight;

      });

  }


  /* SEND MESSAGE */

  async function sendMessage() {

    const text =
      messageInput.value.trim();

    if (!text || !currentChatUser) {
      return;
    }

    const ids = [
      currentUser.uid,
      currentChatUser.uid
    ].sort();

    const chatId =
      ids[0] + "_" + ids[1];

    const messagesRef =
      ref(db, "chats/" + chatId + "/messages");

    await push(
      messagesRef,
      {
        senderId: currentUser.uid,
        receiverId: currentChatUser.uid,
        text: text,
        timestamp: Date.now()
      }
    );

    messageInput.value = "";
    messageInput.focus();

  }


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        sendMessage();
      }

    }
  );


  backButton.addEventListener(
    "click",
    () => {

      appScreen.classList.remove("chatOpen");

      currentChatUser = null;

      if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;
      }

      messageInput.disabled = true;
      sendButton.disabled = true;

    }
  );


  /* HTML SECURITY */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
