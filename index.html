<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-Sholick</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#0b0f14;color:#fff;height:100vh;overflow:hidden}
.hidden{display:none!important}
button{cursor:pointer}

#auth{width:100%;height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at top,#172233,#0b0f14 60%)}
.authbox{width:390px;max-width:92%;background:#111820;border:1px solid #273342;border-radius:20px;padding:35px;box-shadow:0 20px 70px #0008}
.logo{text-align:center;font-size:34px;font-weight:800;margin-bottom:8px;color:#4da3ff}
.subtitle{text-align:center;color:#8996a5;margin-bottom:28px}
.authbox input,.modalBox input{width:100%;padding:14px;margin-bottom:12px;border-radius:10px;border:1px solid #2c3948;background:#0b1118;color:#fff;outline:none;font-size:15px}
.authbox input:focus,.modalBox input:focus{border-color:#4da3ff}
.authbox button{width:100%;padding:14px;margin-top:8px;border:0;border-radius:10px;background:#2589ed;color:white;font-size:15px;font-weight:bold}
.authbox button:hover{background:#1878d8}
#error{color:#ff6262;text-align:center;margin-top:15px;overflow-wrap:anywhere}

#app{width:100%;height:100vh;display:flex}
.sidebar{width:300px;flex-shrink:0;background:#10161d;border-right:1px solid #26303b;display:flex;flex-direction:column}
.sideTop{padding:20px;border-bottom:1px solid #26303b}
.brand{font-size:24px;font-weight:bold;color:#4da3ff}
.me{margin-top:15px;padding:12px;background:#161e27;border-radius:12px}
.meName{font-weight:bold;overflow-wrap:anywhere}
.online{color:#45d483;font-size:12px;margin-top:4px}
.sideButtons{display:flex;gap:8px;padding:12px 15px}
.sideButtons button{flex:1;padding:10px;border:0;border-radius:9px;background:#202b37;color:white}
.sideButtons button:hover,.sideNav:hover{background:#2b3948}
.sectionTitle{padding:10px 15px;color:#718092;font-size:12px;text-transform:uppercase}
.sideNav{margin:7px 15px;padding:12px;border:0;border-radius:10px;background:#173452;color:#fff;text-align:left}
.list{overflow-y:auto;flex:1;min-height:40px}
.listItem{padding:13px 15px;cursor:pointer;border-bottom:1px solid #ffffff08;overflow-wrap:anywhere}
.listItem:hover{background:#18222d}
.listName{font-weight:bold}
.listSub{color:#8492a2;font-size:12px;margin-top:4px}
.logout{margin:15px;padding:12px;border:0;border-radius:10px;background:#27181a;color:#ff6d6d}

.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.chatHeader{min-height:72px;padding:12px 18px;border-bottom:1px solid #26303b;display:flex;align-items:center;gap:12px;background:#10161d}
#back{display:none;border:0;background:#202a35;color:#fff;border-radius:8px;padding:9px 12px}
.chatAvatar{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:#2589ed;display:flex;justify-content:center;align-items:center;font-weight:bold}
.chatTitle{font-weight:bold;overflow-wrap:anywhere}
.chatSub{font-size:12px;color:#748293;margin-top:3px}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;text-align:center;color:#6f7d8d;padding:20px}
.message{max-width:75%;padding:10px 13px;border-radius:13px;background:#18222d;align-self:flex-start;overflow-wrap:anywhere}
.message.mine{background:#1677d2;align-self:flex-end}
.messageSender{font-size:11px;color:#9aa7b5;margin-bottom:4px}
.message.mine .messageSender{color:#d6eaff}
.messageTime{font-size:10px;opacity:.65;margin-top:5px;text-align:right}
.composer{display:flex;gap:10px;padding:15px;border-top:1px solid #26303b;background:#10161d}
.composer input{flex:1;min-width:0;border:1px solid #2c3948;background:#0b1118;color:#fff;border-radius:10px;padding:13px;outline:none}
.composer button{width:90px;border:0;border-radius:10px;background:#2589ed;color:white;font-weight:bold}
.composer button:disabled,.composer input:disabled{opacity:.5;cursor:not-allowed}

.modal{position:fixed;inset:0;background:#000b;display:flex;justify-content:center;align-items:center;z-index:10;padding:15px}
.modalBox{width:420px;max-width:100%;max-height:85vh;overflow-y:auto;background:#111820;border:1px solid #2a3542;border-radius:17px;padding:25px}
.modalBox h2{margin-bottom:18px}
.modalButtons{display:flex;gap:10px}
.modalButtons button{flex:1;padding:12px;border:0;border-radius:9px;background:#2589ed;color:white}
.modalButtons button.cancel{background:#27313d}
.choice,.request{padding:11px;background:#17212b;border-radius:8px;margin-bottom:8px;overflow-wrap:anywhere}
.choice input{width:auto;margin:0 8px 0 0}
.requestButtons{display:flex;gap:8px;margin-top:10px}
.requestButtons button{flex:1;padding:9px;border:0;border-radius:7px}
.accept{background:#2589ed;color:white}
.reject{background:#2b2020;color:#ff7777}

@media(max-width:750px){
 .sidebar{width:100%;border-right:0}
 .chat{display:none}
 #app.mobile-chat .sidebar{display:none}
 #app.mobile-chat .chat{display:flex}
 #back{display:block}
 .message{max-width:88%}
}
</style>
</head>

<body>

<div id="auth">
  <div class="authbox">
    <div class="logo">T-Sholick</div>
    <div class="subtitle">Sohbete katıl, arkadaşlarınla buluş</div>

    <input id="username" type="text" placeholder="Kullanıcı adı" autocomplete="username" maxlength="30">
    <input id="password" type="password" placeholder="Şifre" autocomplete="current-password">

    <button id="register">Hesap Oluştur</button>
    <button id="login">Giriş Yap</button>
    <div id="error"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="sideTop">
      <div class="brand">T-Sholick</div>
      <div class="me">
        <div id="me" class="meName">-</div>
        <div class="online">● Çevrimiçi</div>
      </div>
    </div>

    <button id="publicChatButton" class="sideNav">🌐 Genel Sohbet</button>

    <div class="sideButtons">
      <button id="addFriend">+ Arkadaş</button>
      <button id="createGroup">+ Grup</button>
    </div>

    <div class="sectionTitle">Arkadaşlar</div>
    <div id="friends" class="list"></div>

    <div class="sectionTitle">Gruplar</div>
    <div id="groups" class="list" style="flex:none;max-height:150px"></div>

    <button id="requestsButton" class="sideNav">✉ Arkadaşlık İstekleri</button>
    <button id="logout" class="logout">Çıkış Yap</button>
  </aside>

  <main class="chat">
    <div class="chatHeader">
      <button id="back">←</button>
      <div id="chatAvatar" class="chatAvatar">?</div>
      <div>
        <div id="chatTitle" class="chatTitle">Sohbet seç</div>
        <div id="chatSub" class="chatSub">Bir arkadaş, grup veya genel sohbet seç</div>
      </div>
    </div>

    <div id="messages" class="messages">
      <div class="empty">Bir sohbet seçerek başlayabilirsin.</div>
    </div>

    <div class="composer">
      <input id="message" type="text" placeholder="Mesaj yaz..." maxlength="2000" disabled>
      <button id="send" disabled>Gönder</button>
    </div>
  </main>
</div>

<div id="friendModal" class="modal hidden">
  <div class="modalBox">
    <h2>Arkadaş Ekle</h2>
    <input id="friendUsername" placeholder="Kullanıcı adı" maxlength="30">
    <div class="modalButtons">
      <button id="sendRequest">İstek Gönder</button>
      <button class="cancel" data-close="friendModal">İptal</button>
    </div>
  </div>
</div>

<div id="groupModal" class="modal hidden">
  <div class="modalBox">
    <h2>Grup Oluştur</h2>
    <input id="groupName" placeholder="Grup adı" maxlength="50">
    <div id="friendChoices" style="margin-bottom:15px"></div>
    <div class="modalButtons">
      <button id="makeGroup">Grubu Oluştur</button>
      <button class="cancel" data-close="groupModal">İptal</button>
    </div>
  </div>
</div>

<div id="requestsModal" class="modal hidden">
  <div class="modalBox">
    <h2>Arkadaşlık İstekleri</h2>
    <div id="requests"></div>
    <div class="modalButtons">
      <button class="cancel" data-close="requestsModal">Kapat</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {
  getDatabase, ref, set, get, push, onValue, update, remove
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

/* FIREBASE BAĞLANTISI */
const firebaseConfig = {
  apiKey: "AIzaSyDW_5z_vOGLdXY2vZ1BtSegVXXSud6Mqo8",
  authDomain: "t-sholick.firebaseapp.com",
  databaseURL: "https://t-sholick-default-rtdb.firebaseio.com",
  projectId: "t-sholick",
  storageBucket: "t-sholick.firebasestorage.app",
  messagingSenderId: "903414311425",
  appId: "1:903414311425:web:16e66918d4ad7cf6412e00",
  measurementId: "G-X9Y2GWSJHG"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

const $ = id => document.getElementById(id);

let meUser = null;
let users = {};
let friends = {};
let groups = {};
let currentChat = null;
let messageListener = null;
let listenerStops = [];
let sending = false;

function showError(message) {
  $("error").textContent = message;
}

function usernameKey(username) {
  return username.trim().toLowerCase()
    .replace(/[^a-z0-9_-]/g, "_")
    .replace(/_+/g, "_");
}

function escapeHTML(value) {
  const div = document.createElement("div");
  div.textContent = String(value ?? "");
  return div.innerHTML;
}

async function hashPassword(password) {
  const bytes = new TextEncoder().encode(password);
  const hash = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2, "0")).join("");
}

function addListenerStop(stop) {
  listenerStops.push(stop);
}

function stopAllListeners() {
  listenerStops.forEach(stop => stop());
  listenerStops = [];
  messageListener = null;
}

function handleError(prefix, error) {
  console.error(prefix, error);
  alert(prefix + ": " + (error?.message || "Bilinmeyen hata"));
}

/* KAYIT */
$("register").addEventListener("click", async () => {
  try {
    showError("");
    const username = $("username").value.trim();
    const password = $("password").value;

    if (!/^[a-zA-Z0-9_-]{3,30}$/.test(username)) {
      showError("Kullanıcı adı 3-30 karakter olmalı; harf, sayı, _ ve - kullan.");
      return;
    }
    if (password.length < 6) {
      showError("Şifre en az 6 karakter olmalı.");
      return;
    }

    const key = usernameKey(username);
    const userRef = ref(db, `users/${key}`);
    const snapshot = await get(userRef);

    if (snapshot.exists()) {
      showError("Bu kullanıcı adı zaten kullanılıyor.");
      return;
    }

    await set(userRef, {
      username,
      passwordHash: await hashPassword(password),
      createdAt: Date.now(),
      online: true
    });

    meUser = { username, usernameKey: key };
    localStorage.setItem("tsholick_user", JSON.stringify(meUser));
    openApp();
  } catch (error) {
    showError("Hesap oluşturulamadı: " + error.message);
  }
});

/* GİRİŞ */
$("login").addEventListener("click", async () => {
  try {
    showError("");
    const username = $("username").value.trim();
    const password = $("password").value;

    if (!username || !password) {
      showError("Kullanıcı adı ve şifre gir.");
      return;
    }

    const key = usernameKey(username);
    const snapshot = await get(ref(db, `users/${key}`));

    if (!snapshot.exists()) {
      showError("Kullanıcı bulunamadı.");
      return;
    }

    const user = snapshot.val();
    if (user.passwordHash !== await hashPassword(password)) {
      showError("Şifre yanlış.");
      return;
    }

    await update(ref(db, `users/${key}`), {
      online: true,
      lastLogin: Date.now()
    });

    meUser = { username: user.username, usernameKey: key };
    localStorage.setItem("tsholick_user", JSON.stringify(meUser));
    openApp();
  } catch (error) {
    showError("Giriş yapılamadı: " + error.message);
  }
});

/* UYGULAMAYI AÇ */
function openApp() {
  stopAllListeners();
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("me").textContent = meUser.username;

  loadUsers();
  loadMe();
  loadFriends();
  loadGroups();
  loadRequests();
}

async function checkSession() {
  const saved = localStorage.getItem("tsholick_user");
  if (!saved) return;

  try {
    const session = JSON.parse(saved);
    const snapshot = await get(ref(db, `users/${session.usernameKey}`));

    if (!snapshot.exists()) {
      localStorage.removeItem("tsholick_user");
      return;
    }

    const user = snapshot.val();
    meUser = {
      username: user.username,
      usernameKey: session.usernameKey
    };

    await update(ref(db, `users/${meUser.usernameKey}`), { online: true });
    openApp();
  } catch (error) {
    console.error("Oturum kontrolü:", error);
  }
}

/* PROFİL VE KULLANICILAR */
function loadMe() {
  addListenerStop(onValue(
    ref(db, `users/${meUser.usernameKey}`),
    snapshot => {
      if (snapshot.exists()) $("me").textContent = snapshot.val().username;
    }
  ));
}

function loadUsers() {
  addListenerStop(onValue(ref(db, "users"), snapshot => {
    users = snapshot.val() || {};
    renderFriends();
    renderGroupChoices();
  }));
}

/* ARKADAŞLAR */
function loadFriends() {
  addListenerStop(onValue(
    ref(db, `friends/${meUser.usernameKey}`),
    snapshot => {
      friends = snapshot.val() || {};
      renderFriends();
      renderGroupChoices();
    }
  ));
}

function renderFriends() {
  const box = $("friends");
  box.replaceChildren();

  const keys = Object.keys(friends).filter(key => users[key]);

  if (!keys.length) {
    box.innerHTML = '<div class="listItem"><div class="listSub">Henüz arkadaşın yok.</div></div>';
    return;
  }

  keys.forEach(key => {
    const user = users[key];
    const item = document.createElement("div");
    item.className = "listItem";
    item.innerHTML = `
      <div class="listName">${escapeHTML(user.username)}</div>
      <div class="listSub">${user.online ? "● Çevrimiçi" : "Çevrimdışı"}</div>
    `;
    item.onclick = () => openPrivate(key, user);
    box.appendChild(item);
  });
}

$("addFriend").onclick = () => {
  $("friendUsername").value = "";
  $("friendModal").classList.remove("hidden");
};

$("sendRequest").onclick = async () => {
  try {
    const name = $("friendUsername").value.trim();
    if (!name) return alert("Kullanıcı adı gir.");

    if (!/^[a-zA-Z0-9_-]{3,30}$/.test(name)) {
      return alert("Geçerli bir kullanıcı adı gir.");
    }

    const targetKey = usernameKey(name);
    if (targetKey === meUser.usernameKey) {
      return alert("Kendine istek gönderemezsin.");
    }

    const target = await get(ref(db, `users/${targetKey}`));
    if (!target.exists()) return alert("Bu kullanıcı bulunamadı.");
    if (friends[targetKey]) return alert("Bu kişi zaten arkadaşın.");

    await set(ref(db, `friendRequests/${targetKey}/${meUser.usernameKey}`), {
      from: meUser.usernameKey,
      username: meUser.username,
      createdAt: Date.now()
    });

    alert("Arkadaşlık isteği gönderildi.");
    closeModal("friendModal");
  } catch (error) {
    handleError("İstek gönderilemedi", error);
  }
};

/* ARKADAŞLIK İSTEKLERİ */
function loadRequests() {
  addListenerStop(onValue(
    ref(db, `friendRequests/${meUser.usernameKey}`),
    snapshot => renderRequests(snapshot.val() || {})
  ));
}

function renderRequests(data) {
  const box = $("requests");
  box.replaceChildren();

  const keys = Object.keys(data);
  if (!keys.length) {
    box.innerHTML = '<div class="empty">Bekleyen arkadaşlık isteği yok.</div>';
    return;
  }

  keys.forEach(key => {
    const request = data[key];
    const div = document.createElement("div");
    div.className = "request";
    div.innerHTML = `
      <b>${escapeHTML(request.username || key)}</b>
      <div class="listSub">Sana arkadaşlık isteği gönderdi.</div>
      <div class="requestButtons">
        <button class="accept">Kabul Et</button>
        <button class="reject">Reddet</button>
      </div>
    `;
    div.querySelector(".accept").onclick = () => acceptRequest(key);
    div.querySelector(".reject").onclick = () => rejectRequest(key);
    box.appendChild(div);
  });
}

async function acceptRequest(otherKey) {
  try {
    const snapshot = await get(ref(db, `friendRequests/${meUser.usernameKey}/${otherKey}`));
    if (!snapshot.exists()) return;

    await update(ref(db), {
      [`friends/${meUser.usernameKey}/${otherKey}`]: true,
      [`friends/${otherKey}/${meUser.usernameKey}`]: true
    });

    await remove(ref(db, `friendRequests/${meUser.usernameKey}/${otherKey}`));
  } catch (error) {
    handleError("İstek kabul edilemedi", error);
  }
}

async function rejectRequest(otherKey) {
  try {
    await remove(ref(db, `friendRequests/${meUser.usernameKey}/${otherKey}`));
  } catch (error) {
    handleError("İstek silinemedi", error);
  }
}

$("requestsButton").onclick = () => {
  $("requestsModal").classList.remove("hidden");
};

/* SOHBET AÇMA */
function setChatHeader(title, subtitle, avatar) {
  $("chatTitle").textContent = title;
  $("chatSub").textContent = subtitle;
  $("chatAvatar").textContent = avatar;
  $("message").disabled = false;
  $("send").disabled = false;
  $("app").classList.add("mobile-chat");
}

function privateId(a, b) {
  return [a, b].sort().join("_");
}

function openPrivate(userKey, user) {
  currentChat = {
    type: "private",
    id: privateId(meUser.usernameKey, userKey),
    title: user.username
  };

  setChatHeader(
    user.username,
    user.online ? "Çevrimiçi" : "Çevrimdışı",
    user.username.charAt(0).toUpperCase()
  );
  listenMessages();
}

/* GENEL SOHBET */
$("publicChatButton").onclick = openPublicChat;

function openPublicChat() {
  currentChat = {
    type: "public",
    id: "global",
    title: "Genel Sohbet"
  };

  setChatHeader("🌐 Genel Sohbet", "Tüm kullanıcılarla sohbet et", "🌐");
  listenMessages();
}

/* GRUPLAR */
function loadGroups() {
  addListenerStop(onValue(ref(db, "groups"), snapshot => {
    groups = snapshot.val() || {};
    renderGroups();
  }));
}

function renderGroups() {
  const box = $("groups");
  box.replaceChildren();

  Object.entries(groups).forEach(([id, group]) => {
    if (!group.members?.[meUser.usernameKey]) return;

    const item = document.createElement("div");
    item.className = "listItem";
    item.innerHTML = `
      <div class="listName">${escapeHTML(group.name)}</div>
      <div class="listSub">Grup sohbeti</div>
    `;
    item.onclick = () => openGroup(id, group);
    box.appendChild(item);
  });
}

function renderGroupChoices() {
  const box = $("friendChoices");
  if (!box) return;
  box.replaceChildren();

  Object.keys(friends).forEach(key => {
    const user = users[key];
    if (!user) return;

    const div = document.createElement("div");
    div.className = "choice";

    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = key;

    label.append(checkbox, document.createTextNode(" " + user.username));
    div.appendChild(label);
    box.appendChild(div);
  });
}

$("createGroup").onclick = () => {
  $("groupName").value = "";
  renderGroupChoices();
  $("groupModal").classList.remove("hidden");
};

$("makeGroup").onclick = async () => {
  try {
    const name = $("groupName").value.trim();
    if (!name) return alert("Grup adı gir.");

    const selected = Array.from(
      document.querySelectorAll("#friendChoices input:checked")
    ).map(input => input.value);

    const members = { [meUser.usernameKey]: true };
    selected.forEach(key => { members[key] = true; });

    const groupRef = push(ref(db, "groups"));
    await set(groupRef, {
      name,
      owner: meUser.usernameKey,
      members,
      createdAt: Date.now()
    });

    closeModal("groupModal");
    openGroup(groupRef.key, { name, members });
  } catch (error) {
    handleError("Grup oluşturulamadı", error);
  }
};

function openGroup(groupId, group) {
  currentChat = {
    type: "group",
    id: groupId,
    title: group.name
  };

  setChatHeader(group.name, "Grup sohbeti", group.name.charAt(0).toUpperCase());
  listenMessages();
}

/* MESAJLAR */
function getMessagesRef() {
  if (!currentChat) return null;

  if (currentChat.type === "private") {
    return ref(db, `chats/${currentChat.id}/messages`);
  }

  if (currentChat.type === "public") {
    return ref(db, "publicChat/messages");
  }

  return ref(db, `groups/${currentChat.id}/messages`);
}

function listenMessages() {
  if (messageListener) {
    messageListener();
    messageListener = null;
  }

  $("messages").innerHTML = '<div class="empty">Mesajlar yükleniyor...</div>';

  messageListener = onValue(getMessagesRef(), snapshot => {
    renderMessages(snapshot.val() || {});
  }, error => {
    console.error("Mesajlar okunamadı:", error);
    $("messages").innerHTML = '<div class="empty">Mesajlar yüklenemedi. Veritabanı kurallarını kontrol et.</div>';
  });
}

function renderMessages(data) {
  const box = $("messages");
  box.replaceChildren();

  const entries = Object.entries(data).sort(
    (a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0)
  );

  if (!entries.length) {
    box.innerHTML = '<div class="empty">Henüz mesaj yok. İlk mesajı sen gönder!</div>';
    return;
  }

  entries.forEach(([, msg]) => {
    const mine = msg.senderId === meUser.usernameKey;
    const div = document.createElement("div");
    div.className = "message" + (mine ? " mine" : "");

    const sender = document.createElement("div");
    sender.className = "messageSender";
    sender.textContent = mine ? "Sen" : (msg.senderName || "Kullanıcı");

    const text = document.createElement("div");
    text.className = "messageText";
    text.textContent = msg.text || "";

    const time = document.createElement("div");
    time.className = "messageTime";
    time.textContent = msg.createdAt
      ? new Date(msg.createdAt).toLocaleTimeString("tr-TR", {
          hour: "2-digit", minute: "2-digit"
        })
      : "";

    div.append(sender, text, time);
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

/* MESAJ GÖNDER */
async function sendMessage() {
  if (sending || !currentChat) return;

  const input = $("message");
  const text = input.value.trim();
  if (!text) return;

  sending = true;
  $("send").disabled = true;

  try {
    const messagesRef = getMessagesRef();
    const newMessage = push(messagesRef);

    await set(newMessage, {
      senderId: meUser.usernameKey,
      senderName: meUser.username,
      text,
      createdAt: Date.now()
    });

    input.value = "";
  } catch (error) {
    handleError("Mesaj gönderilemedi", error);
  } finally {
    sending = false;
    $("send").disabled = !currentChat;
  }
}

$("send").onclick = sendMessage;
$("message").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
});

/* GERİ */
$("back").onclick = () => {
  $("app").classList.remove("mobile-chat");

  if (messageListener) {
    messageListener();
    messageListener = null;
  }

  currentChat = null;
  $("message").disabled = true;
  $("send").disabled = true;
  $("chatTitle").textContent = "Sohbet seç";
  $("chatSub").textContent = "Bir arkadaş, grup veya genel sohbet seç";
  $("chatAvatar").textContent = "?";
  $("messages").innerHTML = '<div class="empty">Bir sohbet seçerek başlayabilirsin.</div>';
};

/* ÇIKIŞ */
$("logout").onclick = async () => {
  try {
    if (meUser) {
      await update(ref(db, `users/${meUser.usernameKey}`), { online: false });
    }
  } catch (error) {
    console.error(error);
  }

  stopAllListeners();
  localStorage.removeItem("tsholick_user");
  location.reload();
};

/* MODALLAR */
function closeModal(id) {
  $(id).classList.add("hidden");
}

document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => closeModal(button.dataset.close));
});

checkSession();
</script>
