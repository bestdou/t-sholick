<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>T-Sholick</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0b0f14;color:#fff;height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#auth{
height:100vh;display:flex;align-items:center;justify-content:center;
padding:20px;background:radial-gradient(circle at top,#182433,#0b0f14 60%)
}
.authbox{
width:100%;max-width:400px;background:#111820;border:1px solid #26313d;
border-radius:20px;padding:30px;box-shadow:0 20px 70px #0008
}
.logo{text-align:center;font-size:32px;font-weight:bold;margin-bottom:8px}
.sub{text-align:center;color:#8996a3;margin-bottom:25px}
.authbox input{
width:100%;padding:14px;margin-bottom:11px;background:#0b1016;
border:1px solid #293541;border-radius:12px;color:white;outline:none
}
.authbox button{
width:100%;padding:14px;border:0;border-radius:12px;margin-top:4px
}
.primary{background:#347cff;color:white}
.secondary{background:#18212b;color:white;border:1px solid #303c48!important}
#error{text-align:center;color:#ff7070;font-size:14px;margin-top:12px;min-height:20px}

#app{height:100vh;display:flex}
.sidebar{
width:320px;background:#10161d;border-right:1px solid #26313d;
display:flex;flex-direction:column
}
.sideTop{
padding:18px;border-bottom:1px solid #26313d;
display:flex;justify-content:space-between;align-items:center
}
.sideTop h1{font-size:22px}
.logout{background:none;border:0;color:#ff7070}

.me{padding:14px 18px;color:#9aa5b0;border-bottom:1px solid #202a33}
.sectionTitle{
padding:15px 18px 7px;color:#788692;font-size:12px;
text-transform:uppercase
}
#friends,#groups{overflow:auto}
.item{
padding:12px 18px;display:flex;align-items:center;gap:11px;
cursor:pointer
}
.item:hover,.item.active{background:#19222c}
.avatar{
width:40px;height:40px;border-radius:50%;
background:linear-gradient(135deg,#347cff,#7a4dff);
display:flex;align-items:center;justify-content:center;
font-weight:bold;flex-shrink:0
}
.info{min-width:0}
.info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;color:#697580;margin-top:3px}
.online{color:#53dc88}
.add{
margin:8px 18px;padding:11px;border-radius:10px;
border:1px dashed #40505e;background:#111820;color:white
}

.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.header{
height:72px;padding:0 20px;border-bottom:1px solid #26313d;
display:flex;align-items:center;gap:12px;background:#10161d
}
#chatTitle{font-size:17px;font-weight:bold}
#chatSub{font-size:12px;color:#71808c;margin-top:3px}
#messages{
flex:1;overflow:auto;padding:24px;
display:flex;flex-direction:column;gap:8px
}
.empty{margin:auto;text-align:center;color:#687681}
.msg{
max-width:min(70%,600px);padding:10px 14px;border-radius:16px;
line-height:1.4;word-break:break-word
}
.mine{align-self:flex-end;background:#347cff;border-bottom-right-radius:4px}
.theirs{align-self:flex-start;background:#202a34;border-bottom-left-radius:4px}
.sender{font-size:11px;color:#8ea0ad;margin-bottom:3px}
.time{font-size:10px;opacity:.6;display:block;text-align:right;margin-top:4px}

.composer{
padding:14px;border-top:1px solid #26313d;display:flex;gap:9px
}
#message{
flex:1;background:#0b1016;border:1px solid #2b3743;
color:white;border-radius:13px;padding:13px;outline:none
}
#send{
width:52px;border:0;border-radius:13px;background:#347cff;color:white;
font-size:19px
}

.back{display:none;background:none;border:0;color:white;font-size:22px}

.modal{
position:fixed;inset:0;background:#0009;display:flex;
align-items:center;justify-content:center;padding:20px;z-index:10
}
.modalbox{
width:100%;max-width:450px;background:#111820;
border:1px solid #2b3743;border-radius:18px;padding:22px
}
.modalbox h2{margin-bottom:16px}
.modalbox input,.modalbox select{
width:100%;padding:13px;background:#0b1016;color:white;
border:1px solid #2b3743;border-radius:10px;margin-bottom:10px
}
.modalButtons{display:flex;gap:8px;margin-top:8px}
.modalButtons button{flex:1;padding:12px;border-radius:10px;border:0}
.close{background:#202a34;color:white}
.ok{background:#347cff;color:white}

.checkUser{
display:flex;align-items:center;gap:10px;padding:9px;
background:#151e27;border-radius:9px;margin-bottom:6px
}
.checkUser input{width:auto;margin:0}

@media(max-width:700px){
.sidebar{width:100%}
.chat{display:none}
#app.openChat .sidebar{display:none}
#app.openChat .chat{display:flex}
.back{display:block}
.msg{max-width:85%}
}
</style>
</head>

<body>

<div id="auth">
<div class="authbox">
<div class="logo">T-Sholick</div>
<div class="sub">Arkadaşlarınla özel olarak sohbet et.</div>

<input id="email" type="email" placeholder="E-posta">
<input id="password" type="password" placeholder="Şifre">
<input id="username" placeholder="Kullanıcı adı">

<button class="primary" id="register">Hesap oluştur</button>
<button class="secondary" id="login">Giriş yap</button>

<div id="error"></div>
</div>
</div>

<div id="app" class="hidden">

<aside class="sidebar">

<div class="sideTop">
<h1>T-Sholick</h1>
<button class="logout" id="logout">Çıkış</button>
</div>

<div class="me" id="me">Kullanıcı</div>

<div class="sectionTitle">Arkadaşlar</div>
<div id="friends"></div>

<button class="add" id="addFriend">＋ Arkadaş ekle</button>

<div class="sectionTitle">Gruplar</div>
<div id="groups"></div>

<button class="add" id="createGroup">＋ Grup oluştur</button>

</aside>

<main class="chat">

<div class="header">
<button class="back" id="back">←</button>
<div class="avatar" id="chatAvatar">?</div>
<div>
<div id="chatTitle">T-Sholick</div>
<div id="chatSub">Bir arkadaş veya grup seç</div>
</div>
</div>

<div id="messages">
<div class="empty">Bir sohbet seç 💬</div>
</div>

<div class="composer">
<input id="message" placeholder="Mesaj yaz..." disabled>
<button id="send" disabled>➤</button>
</div>

</main>
</div>


<!-- ARKADAŞ EKLE MODAL -->

<div class="modal hidden" id="friendModal">
<div class="modalbox">
<h2>Arkadaş ekle</h2>
<input id="friendUsername" placeholder="Kullanıcı adı">
<div class="modalButtons">
<button class="close" onclick="closeModal('friendModal')">İptal</button>
<button class="ok" id="sendRequest">İstek gönder</button>
</div>
</div>
</div>


<!-- GRUP MODAL -->

<div class="modal hidden" id="groupModal">
<div class="modalbox">
<h2>Yeni grup</h2>

<input id="groupName" placeholder="Grup adı">

<div id="friendChoices"></div>

<div class="modalButtons">
<button class="close" onclick="closeModal('groupModal')">İptal</button>
<button class="ok" id="makeGroup">Grubu oluştur</button>
</div>

</div>
</div>


<!-- İSTEKLER MODAL -->

<div class="modal hidden" id="requestsModal">
<div class="modalbox">
<h2>Arkadaşlık istekleri</h2>
<div id="requests"></div>
<button class="close" style="width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px"
onclick="closeModal('requestsModal')">Kapat</button>
</div>
</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
getDatabase,
ref,
set,
push,
onValue,
get,
update
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


const firebaseConfig={
apiKey:"AIzaSyDW_5z_vOGLdXY2vZ1BtSegVXXSud6Mqo8",
authDomain:"t-sholick.firebaseapp.com",
databaseURL:"https://t-sholick-default-rtdb.firebaseio.com",
projectId:"t-sholick",
storageBucket:"t-sholick.firebasestorage.app",
messagingSenderId:"903414311425",
appId:"1:903414311425:web:16e66918d4ad7cf6412e00",
measurementId:"G-X9Y2GWSJHG"
};

const firebase=initializeApp(firebaseConfig);
const auth=getAuth(firebase);
const db=getDatabase(firebase);


let meUser=null;
let users={};
let friends={};
let groups={};
let currentChat=null;
let messageListener=null;


const $=id=>document.getElementById(id);

function esc(x){
return String(x||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}


function errorText(e){

const map={
"auth/email-already-in-use":"Bu e-posta zaten kayıtlı.",
"auth/invalid-email":"Geçersiz e-posta.",
"auth/weak-password":"Şifre en az 6 karakter olmalı.",
"auth/invalid-credential":"E-posta veya şifre yanlış.",
"auth/invalid-login-credentials":"E-posta veya şifre yanlış."
};

$("error").textContent=map[e.code]||"Bir hata oluştu.";

}


$("register").onclick=async()=>{

const email=$("email").value.trim();
const password=$("password").value;
const username=$("username").value.trim();

if(!email||!password||!username){
$("error").textContent="Tüm alanları doldur.";
return;
}

if(username.length<3){
$("error").textContent="Kullanıcı adı en az 3 karakter.";
return;
}

try{

const result=await createUserWithEmailAndPassword(
auth,email,password
);

await set(ref(db,"users/"+result.user.uid),{
username,
createdAt:Date.now(),
online:true
});

}catch(e){
errorText(e);
}

};


$("login").onclick=async()=>{

try{

await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

}catch(e){
errorText(e);
}

};


$("logout").onclick=async()=>{

if(meUser){
await update(ref(db,"users/"+meUser.uid),{online:false});
}

await signOut(auth);

};


onAuthStateChanged(auth,async user=>{

if(!user){

$("auth").classList.remove("hidden");
$("app").classList.add("hidden");
return;

}

meUser=user;

$("auth").classList.add("hidden");
$("app").classList.remove("hidden");

await update(ref(db,"users/"+user.uid),{online:true});

loadUsers();
loadMe();
loadFriends();
loadGroups();
loadRequests();

});


function loadMe(){

onValue(ref(db,"users/"+meUser.uid),snap=>{

const u=snap.val();

if(u){
$("me").textContent="Sen: "+u.username;
}

});

}


function loadUsers(){

onValue(ref(db,"users"),snap=>{
users=snap.val()||{};
});

}


function loadFriends(){

onValue(ref(db,"friends/"+meUser.uid),snap=>{

friends=snap.val()||{};
renderFriends();

});

}


function renderFriends(){

$("friends").innerHTML="";

Object.keys(friends).forEach(uid=>{

const u=users[uid];

if(!u)return;

const item=document.createElement("div");

item.className="item";

item.innerHTML=`
<div class="avatar">
${esc(u.username[0].toUpperCase())}
</div>
<div class="info">
<strong>${esc(u.username)}</strong>
<div class="status ${u.online?"online":""}">
${u.online?"● Çevrimiçi":"Çevrimdışı"}
</div>
</div>
`;

item.onclick=()=>openPrivate(uid,u);

$("friends").appendChild(item);

});

if(Object.keys(friends).length===0){

$("friends").innerHTML=
`<div style="padding:10px 18px;color:#687681;font-size:13px">
Henüz arkadaşın yok.
</div>`;

}

}


$("addFriend").onclick=()=>{
$("friendModal").classList.remove("hidden");
$("friendUsername").value="";
};


$("sendRequest").onclick=async()=>{

const name=$("friendUsername").value.trim().toLowerCase();

if(!name)return;

let found=null;

for(const [uid,u] of Object.entries(users)){

if(
uid!==meUser.uid &&
(u.username||"").toLowerCase()===name
){
found={uid,...u};
break;
}

}

if(!found){
alert("Bu kullanıcı bulunamadı.");
return;
}

await set(
ref(db,"friendRequests/"+found.uid+"/"+meUser.uid),
{
from:meUser.uid,
username:users[meUser.uid]?.username||"Kullanıcı",
createdAt:Date.now()
}
);

alert("Arkadaşlık isteği gönderildi.");

closeModal("friendModal");

};


function loadRequests(){

onValue(
ref(db,"friendRequests/"+meUser.uid),
snap=>{

const requests=snap.val()||{};
const count=Object.keys(requests).length;

if(count>0){

$("requestsModal").dataset.has="true";

}

renderRequests(requests);

});

}


function renderRequests(requests){

$("requests").innerHTML="";

for(const [uid,r] of Object.entries(requests)){

const div=document.createElement("div");

div.style.cssText=
"padding:12px;background:#18212b;border-radius:10px;margin-bottom:8px";

div.innerHTML=`
<strong>${esc(r.username)}</strong>
<div style="margin-top:8px;display:flex;gap:6px">
<button class="ok" style="padding:7px;border:0;border-radius:7px"
data-uid="${uid}">Kabul et</button>
<button class="close" style="padding:7px;border:0;border-radius:7px"
data-deny="${uid}">Reddet</button>
</div>
`;

div.querySelector("[data-uid]").onclick=
()=>acceptFriend(uid);

div.querySelector("[data-deny]").onclick=
()=>rejectFriend(uid);

$("requests").appendChild(div);

}

if(Object.keys(requests).length){
$("requestsModal").classList.remove("hidden");
}

}


async function acceptFriend(uid){

const myName=users[meUser.uid]?.username||"Kullanıcı";
const theirName=users[uid]?.username||"Kullanıcı";

const changes={};

changes[`friends/${meUser.uid}/${uid}`]=true;
changes[`friends/${uid}/${meUser.uid}`]=true;

await update(ref(db),changes);

await set(
ref(db,"friendRequests/"+meUser.uid+"/"+uid),
null
);

}


async function rejectFriend(uid){

await set(
ref(db,"friendRequests/"+meUser.uid+"/"+uid),
null
);

}


function loadGroups(){

onValue(ref(db,"groups"),snap=>{

const all=snap.val()||{};
groups={};

for(const [id,g] of Object.entries(all)){

if(g.members && g.members[meUser.uid]){
groups[id]=g;
}

}

renderGroups();

});

}


function renderGroups(){

$("groups").innerHTML="";

for(const [id,g] of Object.entries(groups)){

const item=document.createElement("div");

item.className="item";

item.innerHTML=`
<div class="avatar">
${esc((g.name||"G")[0].toUpperCase())}
</div>
<div class="info">
<strong>${esc(g.name)}</strong>
<div class="status">
${Object.keys(g.members||{}).length} üye
</div>
</div>
`;

item.onclick=()=>openGroup(id,g);

$("groups").appendChild(item);

}

if(Object.keys(groups).length===0){

$("groups").innerHTML=
`<div style="padding:10px 18px;color:#687681;font-size:13px">
Henüz grup yok.
</div>`;

}

}


$("createGroup").onclick=()=>{

$("groupModal").classList.remove("hidden");
$("groupName").value="";

$("friendChoices").innerHTML="";

for(const uid of Object.keys(friends)){

const u=users[uid];

if(!u)continue;

const div=document.createElement("label");

div.className="checkUser";

div.innerHTML=`
<input type="checkbox" value="${uid}">
<span>${esc(u.username)}</span>
`;

$("friendChoices").appendChild(div);

}

};


$("makeGroup").onclick=async()=>{

const name=$("groupName").value.trim();

if(!name){
alert("Grup adı yaz.");
return;
}

const selected=[
...$("friendChoices").querySelectorAll("input:checked")
].map(x=>x.value);

const members={
[meUser.uid]:true
};

selected.forEach(uid=>{
members[uid]=true;
});

const groupRef=push(ref(db,"groups"));

await set(groupRef,{
name,
owner:meUser.uid,
createdAt:Date.now(),
members
});

closeModal("groupModal");

};


function openPrivate(uid,u){

currentChat={
type:"private",
id:uid,
name:u.username,
uid
};

$("chatTitle").textContent=u.username;
$("chatSub").textContent=u.online?"● Çevrimiçi":"Çevrimdışı";
$("chatSub").style.color=u.online?"#53dc88":"#71808c";
$("chatAvatar").textContent=
(u.username||"?")[0].toUpperCase();

$("message").disabled=false;
$("send").disabled=false;

$("app").classList.add("openChat");

listenMessages();

}


function openGroup(id,g){

currentChat={
type:"group",
id,
name:g.name,
group:g
};

$("chatTitle").textContent=g.name;
$("chatSub").textContent=
Object.keys(g.members||{}).length+" üye";

$("chatSub").style.color="#71808c";
$("chatAvatar").textContent=
(g.name||"G")[0].toUpperCase();

$("message").disabled=false;
$("send").disabled=false;

$("app").classList.add("openChat");

listenMessages();

}


function privateId(a,b){

return [a,b].sort().join("_");

}


function listenMessages(){

if(messageListener){
messageListener();
messageListener=null;
}

let path;

if(currentChat.type==="private"){

path=
"chats/"+privateId(meUser.uid,currentChat.uid)+"/messages";

}else{

path=
"groups/"+currentChat.id+"/messages";

}

messageListener=onValue(ref(db,path),snap=>{

$("messages").innerHTML="";

const data=snap.val()||{};

const list=Object.values(data).sort(
(a,b)=>(a.timestamp||0)-(b.timestamp||0)
);

if(!list.length){

$("messages").innerHTML=
`<div class="empty">Henüz mesaj yok.<br>İlk mesajı sen gönder 👋</div>`;

return;

}

list.forEach(m=>{

const div=document.createElement("div");

div.className=
"msg "+(m.senderId===meUser.uid?"mine":"theirs");

let sender="";

if(currentChat.type==="group" &&
m.senderId!==meUser.uid){

sender=
`<div class="sender">${esc(
users[m.senderId]?.username||"Kullanıcı"
)}</div>`;

}

const time=new Date(
m.timestamp||Date.now()
).toLocaleTimeString("tr-TR",{
hour:"2-digit",
minute:"2-digit"
});

div.innerHTML=
sender+
esc(m.text)+
`<span class="time">${time}</span>`;

$("messages").appendChild(div);

});

$("messages").scrollTop=$("messages").scrollHeight;

});

}


async function sendMessage(){

const text=$("message").value.trim();

if(!text||!currentChat)return;

let path;

if(currentChat.type==="private"){

path=
"chats/"+privateId(meUser.uid,currentChat.uid)+"/messages";

}else{

path=
"groups/"+currentChat.id+"/messages";

}

await push(ref(db,path),{
senderId:meUser.uid,
text,
timestamp:Date.now()
});

$("message").value="";
$("message").focus();

}


$("send").onclick=sendMessage;

$("message").addEventListener("keydown",e=>{

if(e.key==="Enter"){
e.preventDefault();
sendMessage();
}

});


$("back").onclick=()=>{

$("app").classList.remove("openChat");

currentChat=null;

if(messageListener){
messageListener();
messageListener=null;
}

$("message").disabled=true;
$("send").disabled=true;

};


function closeModal(id){
$(id).classList.add("hidden");
}

window.closeModal=closeModal;

</script>
</body>
</html>
