<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-Sholick</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0f14;
  color:#fff;
  height:100vh;
  overflow:hidden;
}

.hidden{
  display:none!important;
}

/* AUTH */

#auth{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at top,#172233 0%,#0b0f14 55%);
}

.authbox{
  width:390px;
  max-width:92%;
  background:#111820;
  border:1px solid #273342;
  border-radius:20px;
  padding:35px;
  box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:800;
  margin-bottom:8px;
  color:#4da3ff;
}

.subtitle{
  text-align:center;
  color:#8996a5;
  margin-bottom:28px;
}

.authbox input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #2c3948;
  background:#0b1118;
  color:#fff;
  outline:none;
  font-size:15px;
}

.authbox input:focus{
  border-color:#4da3ff;
}

.authbox button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#2589ed;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.authbox button:hover{
  background:#1878d8;
}

#error{
  color:#ff6262;
  text-align:center;
  margin-top:15px;
  min-height:20px;
}

/* APP */

#app{
  width:100%;
  height:100vh;
  display:flex;
}

.sidebar{
  width:300px;
  background:#10161d;
  border-right:1px solid #26303b;
  display:flex;
  flex-direction:column;
}

.sideTop{
  padding:20px;
  border-bottom:1px solid #26303b;
}

.brand{
  font-size:24px;
  font-weight:bold;
  color:#4da3ff;
}

.me{
  margin-top:15px;
  padding:12px;
  background:#161e27;
  border-radius:12px;
}

.meName{
  font-weight:bold;
}

.online{
  color:#45d483;
  font-size:12px;
  margin-top:4px;
}

.sideButtons{
  display:flex;
  gap:8px;
  padding:15px;
}

.sideButtons button{
  flex:1;
  padding:10px;
  border:0;
  border-radius:9px;
  background:#202b37;
  color:white;
  cursor:pointer;
}

.sideButtons button:hover{
  background:#2b3948;
}

.sectionTitle{
  padding:10px 15px;
  color:#718092;
  font-size:12px;
  text-transform:uppercase;
}

.list{
  overflow-y:auto;
  flex:1;
}

.listItem{
  padding:13px 15px;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.03);
}

.listItem:hover{
  background:#18222d;
}

.listName{
  font-weight:bold;
}

.listSub{
  color:#718092;
  font-size:12px;
  margin-top:3px;
}

.logout{
  margin:15px;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#27181a;
  color:#ff6d6d;
  cursor:pointer;
}

/* CHAT */

.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chatHeader{
  height:72px;
  padding:12px 18px;
  border-bottom:1px solid #26303b;
  display:flex;
  align-items:center;
  gap:12px;
  background:#10161d;
}

#back{
  display:none;
  border:0;
  background:#202a35;
  color:#fff;
  border-radius:8px;
  padding:9px 12px;
  cursor:pointer;
}

.chatAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#2589ed;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

.chatTitle{
  font-weight:bold;
}

.chatSub{
  font-size:12px;
  color:#748293;
  margin-top:3px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.empty{
  margin:auto;
  text-align:center;
  color:#6f7d8d;
}

.message{
  max-width:70%;
  padding:10px 13px;
  border-radius:13px;
  background:#18222d;
  align-self:flex-start;
}

.message.mine{
  background:#1677d2;
  align-self:flex-end;
}

.messageSender{
  font-size:11px;
  color:#9aa7b5;
  margin-bottom:4px;
}

.message.mine .messageSender{
  color:#d6eaff;
}

.messageText{
  word-break:break-word;
}

.messageTime{
  font-size:10px;
  opacity:.55;
  margin-top:4px;
}

.composer{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid #26303b;
  background:#10161d;
}

.composer input{
  flex:1;
  border:1px solid #2c3948;
  background:#0b1118;
  color:#fff;
  border-radius:10px;
  padding:13px;
  outline:none;
}

.composer button{
  width:90px;
  border:0;
  border-radius:10px;
  background:#2589ed;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* MODALS */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.modalBox{
  width:420px;
  max-width:92%;
  background:#111820;
  border:1px solid #2a3542;
  border-radius:17px;
  padding:25px;
}

.modalBox h2{
  margin-bottom:18px;
}

.modalBox input{
  width:100%;
  padding:13px;
  background:#0b1118;
  color:#fff;
  border:1px solid #2c3948;
  border-radius:9px;
  outline:none;
  margin-bottom:12px;
}

.modalButtons{
  display:flex;
  gap:10px;
}

.modalButtons button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:9px;
  cursor:pointer;
  background:#2589ed;
  color:white;
}

.modalButtons button.cancel{
  background:#27313d;
}

.choice{
  padding:10px;
  background:#17212b;
  border-radius:8px;
  margin-bottom:7px;
}

.request{
  padding:12px;
  background:#17212b;
  border-radius:10px;
  margin-bottom:10px;
}

.requestButtons{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.requestButtons button{
  flex:1;
  padding:8px;
  border:0;
  border-radius:7px;
  cursor:pointer;
}

.accept{
  background:#2589ed;
  color:white;
}

.reject{
  background:#2b2020;
  color:#ff7777;
}

@media(max-width:750px){

  .sidebar{
    width:100%;
  }

  .chat{
    display:none;
  }

  #app.mobile-chat .sidebar{
    display:none;
  }

  #app.mobile-chat .chat{
    display:flex;
  }

  #back{
    display:block;
  }

  .message{
    max-width:85%;
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="auth">

  <div class="authbox">

    <div class="logo">T-Sholick</div>

    <div class="subtitle">
      Hesabına giriş yap veya yeni hesap oluştur
    </div>

    <input
      id="username"
      type="text"
      placeholder="Kullanıcı adı"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Şifre"
      autocomplete="current-password"
    >

    <button id="register">
      Hesap Oluştur
    </button>

    <button id="login">
      Giriş Yap
    </button>

    <div id="error"></div>

  </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sideTop">

      <div class="brand">
        T-Sholick
      </div>

      <div class="me">
        <div
          id="me"
          class="meName"
        >
          -
        </div>

        <div class="online">
          ● Çevrimiçi
        </div>
      </div>

    </div>

    <div class="sideButtons">

      <button id="addFriend">
        + Arkadaş
      </button>

      <button id="createGroup">
        + Grup
      </button>

    </div>

    <div class="sectionTitle">
      Arkadaşlar
    </div>

    <div
      id="friends"
      class="list"
    ></div>

    <div class="sectionTitle">
      Gruplar
    </div>

    <div
      id="groups"
      class="list"
      style="flex:none;max-height:180px;"
    ></div>

    <button
      id="requestsButton"
      class="sideButtons"
      style="
        margin:10px 15px;
        width:calc(100% - 30px);
        padding:11px;
        border:0;
        border-radius:9px;
        background:#202b37;
        color:#fff;
        cursor:pointer;
      "
    >
      Arkadaşlık İstekleri
    </button>

    <button
      id="logout"
      class="logout"
    >
      Çıkış Yap
    </button>

  </aside>


  <!-- CHAT -->

  <main class="chat">

    <div class="chatHeader">

      <button id="back">
        ←
      </button>

      <div
        id="chatAvatar"
        class="chatAvatar"
      >
        ?
      </div>

      <div>

        <div
          id="chatTitle"
          class="chatTitle"
        >
          Sohbet seç
        </div>

        <div
          id="chatSub"
          class="chatSub"
        >
          Bir arkadaş veya grup seç
        </div>

      </div>

    </div>

    <div
      id="messages"
      class="messages"
    >
      <div class="empty">
        Bir sohbet seçerek başlayabilirsin.
      </div>
    </div>

    <div class="composer">

      <input
        id="message"
        type="text"
        placeholder="Mesaj yaz..."
        disabled
      >

      <button

        disabled
      >
        Gönder
      </button>

    </div>

  </main>

</div>


<!-- FRIEND MODAL -->

<div
  id="friendModal"
  class="modal hidden"
>

  <div class="modalBox">

    <h2>Arkadaş Ekle</h2>

    <input
      id="friendUsername"
      placeholder="Kullanıcı adı"
    >

    <div class="modalButtons">

      <button
        id="sendRequest"
      >
        İstek Gönder
      </button>

      <button
        class="cancel"
        onclick="closeModal('friendModal')"
      >
        İptal
      </button>

    </div>

  </div>

</div>


<!-- GROUP MODAL -->

<div
  id="groupModal"
  class="modal hidden"
>

  <div class="modalBox">

    <h2>Grup Oluştur</h2>

    <input
      id="groupName"
      placeholder="Grup adı"
    >

    <div
      id="friendChoices"
      style="margin-bottom:15px;"
    ></div>

    <div class="modalButtons">

      <button id="makeGroup">
        Grubu Oluştur
      </button>

      <button
        class="cancel"
        onclick="closeModal('groupModal')"
      >
        İptal
      </button>

    </div>

  </div>

</div>


<!-- REQUEST MODAL -->

<div
  id="requestsModal"
  class="modal hidden"
>

  <div class="modalBox">

    <h2>Arkadaşlık İstekleri</h2>

    <div id="requests"></div>

    <div class="modalButtons">

      <button
        class="cancel"
        onclick="closeModal('requestsModal')"
      >
        Kapat
      </button>

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  push,
  onValue,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyDW_5z_vOGLdXY2vZ1BtSegVXXSud6Mqo8",

  authDomain: "t-sholick.firebaseapp.com",

  databaseURL:
    "https://t-sholick-default-rtdb.firebaseio.com",

  projectId: "t-sholick",

  storageBucket:
    "t-sholick.firebasestorage.app",

  messagingSenderId:
    "903414311425",

  appId:
    "1:903414311425:web:16e66918d4ad7cf6412e00",

  measurementId:
    "G-X9Y2GWSJHG"

};


const firebaseApp =
  initializeApp(firebaseConfig);

const db =
  getDatabase(firebaseApp);


/* STATE */

let meUser = null;

let users = {};

let friends = {};

let groups = {};

let currentChat = null;

let messageListener = null;


/* HELPERS */

const $ = id =>
  document.getElementById(id);


function showError(message){

  $("error").textContent = message;

}


async function hashPassword(password){

  const encoder =
    new TextEncoder();

  const data =
    encoder.encode(password);

  const hash =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );

  return Array.from(
    new Uint8Array(hash)
  )
  .map(
    b => b.toString(16).padStart(2,"0")
  )
  .join("");

}


function usernameKey(username){

  return username
    .trim()
    .toLowerCase()
    .replace(/\s+/g,"_");

}


function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text ?? "";

  return div.innerHTML;

}


/* REGISTER */

$("register").addEventListener(
  "click",
  async () => {

    try{

      showError("");

      const username =
        $("username").value.trim();

      const password =
        $("password").value;


      if(username.length < 3){

        showError(
          "Kullanıcı adı en az 3 karakter olmalı."
        );

        return;
      }


      if(password.length < 6){

        showError(
          "Şifre en az 6 karakter olmalı."
        );

        return;
      }


      const key =
        usernameKey(username);


      const userRef =
        ref(db,`users/${key}`);


      const snapshot =
        await get(userRef);


      if(snapshot.exists()){

        showError(
          "Bu kullanıcı adı zaten kullanılıyor."
        );

        return;
      }


      const passwordHash =
        await hashPassword(password);


      await set(
        userRef,
        {

          username: username,

          passwordHash: passwordHash,

          createdAt: Date.now(),

          online: true

        }
      );


      meUser = {

        username,

        usernameKey: key

      };


      localStorage.setItem(
        "tsholick_user",
        JSON.stringify(meUser)
      );


      openApp();

    }catch(error){

      console.error(error);

      showError(
        "Hesap oluşturulamadı: " +
        error.message
      );

    }

  }
);


/* LOGIN */

$("login").addEventListener(
  "click",
  async () => {

    try{

      showError("");

      const username =
        $("username").value.trim();

      const password =
        $("password").value;


      if(!username || !password){

        showError(
          "Kullanıcı adı ve şifre gir."
        );

        return;
      }


      const key =
        usernameKey(username);


      const userRef =
        ref(db,`users/${key}`);


      const snapshot =
        await get(userRef);


      if(!snapshot.exists()){

        showError(
          "Kullanıcı bulunamadı."
        );

        return;
      }


      const user =
        snapshot.val();


      const passwordHash =
        await hashPassword(password);


      if(
        user.passwordHash !==
        passwordHash
      ){

        showError(
          "Şifre yanlış."
        );

        return;
      }


      await update(
        userRef,
        {
          online:true,
          lastLogin:Date.now()
        }
      );


      meUser = {

        username:
          user.username,

        usernameKey:
          key

      };


      localStorage.setItem(
        "tsholick_user",
        JSON.stringify(meUser)
      );


      openApp();

    }catch(error){

      console.error(error);

      showError(
        "Giriş yapılamadı: " +
        error.message
      );

    }

  }
);


/* OPEN APP */

function openApp(){

  $("auth").classList.add("hidden");

  $("app").classList.remove("hidden");

  $("me").textContent =
    meUser.username;

  loadUsers();

  loadMe();

  loadFriends();

  loadGroups();

  loadRequests();

}


/* SESSION */

async function checkSession(){

  const saved =
    localStorage.getItem(
      "tsholick_user"
    );


  if(!saved){

    return;

  }


  try{

    const session =
      JSON.parse(saved);


    const snapshot =
      await get(
        ref(
          db,
          `users/${session.usernameKey}`
        )
      );


    if(!snapshot.exists()){

      localStorage.removeItem(
        "tsholick_user"
      );

      return;

    }


    meUser = session;


    await update(
      ref(
        db,
        `users/${session.usernameKey}`
      ),
      {
        online:true
      }
    );


    openApp();

  }catch(error){

    console.error(error);

    localStorage.removeItem(
      "tsholick_user"
    );

  }

}


/* ME */

function loadMe(){

  if(!meUser) return;


  onValue(
    ref(
      db,
      `users/${meUser.usernameKey}`
    ),
    snapshot => {

      if(
        snapshot.exists()
      ){

        const user =
          snapshot.val();

        $("me").textContent =
          user.username ||
          meUser.username;

      }

    }
  );

}


/* USERS */

function loadUsers(){

  onValue(
    ref(db,"users"),
    snapshot => {

      users =
        snapshot.val() || {};

      renderFriends();

      renderGroupChoices();

    }
  );

}


/* FRIENDS */

function loadFriends(){

  onValue(
    ref(
      db,
      `friends/${meUser.usernameKey}`
    ),
    snapshot => {

      friends =
        snapshot.val() || {};

      renderFriends();

      renderGroupChoices();

    }
  );

}


function renderFriends(){

  const box =
    $("friends");

  box.innerHTML = "";


  const keys =
    Object.keys(friends);


  if(keys.length === 0){

    box.innerHTML =
      `<div class="listItem">
        <div class="listSub">
          Henüz arkadaşın yok.
        </div>
      </div>`;

    return;

  }


  keys.forEach(
    key => {

      const user =
        users[key];


      if(!user) return;


      const item =
        document.createElement("div");

      item.className =
        "listItem";


      item.innerHTML = `

        <div class="listName">
          ${escapeHTML(user.username)}
        </div>

        <div class="listSub">
          ${user.online ? "● Çevrimiçi" : "Çevrimdışı"}
        </div>

      `;


      item.onclick =
        () => openPrivate(
          key,
          user
        );


      box.appendChild(item);

    }
  );

}


/* ADD FRIEND */

$("addFriend").onclick =
  () => {

    $("friendUsername").value = "";

    $("friendModal")
      .classList.remove("hidden");

  };


$("sendRequest").onclick =
  async () => {

    try{

      const name =
        $("friendUsername")
          .value
          .trim();


      if(!name){

        alert(
          "Kullanıcı adı gir."
        );

        return;

      }


      const targetKey =
        usernameKey(name);


      if(
        targetKey ===
        meUser.usernameKey
      ){

        alert(
          "Kendine arkadaşlık isteği gönderemezsin."
        );

        return;

      }


      const targetSnapshot =
        await get(
          ref(
            db,
            `users/${targetKey}`
          )
        );


      if(!targetSnapshot.exists()){

        alert(
          "Bu kullanıcı bulunamadı."
        );

        return;

      }


      if(
        friends[targetKey]
      ){

        alert(
          "Bu kişi zaten arkadaşın."
        );

        return;

      }


      await set(
        ref(
          db,
          `friendRequests/${targetKey}/${meUser.usernameKey}`
        ),
        {

          from:
            meUser.usernameKey,

          username:
            meUser.username,

          createdAt:
            Date.now()

        }
      );


      alert(
        "Arkadaşlık isteği gönderildi."
      );


      closeModal(
        "friendModal"
      );

    }catch(error){

      console.error(error);

      alert(
        "İstek gönderilemedi: " +
        error.message
      );

    }

  };


/* REQUESTS */

function loadRequests(){

  onValue(
    ref(
      db,
      `friendRequests/${meUser.usernameKey}`
    ),
    snapshot => {

      const data =
        snapshot.val() || {};

      renderRequests(data);

    }
  );

}


function renderRequests(data){

  const box =
    $("requests");

  box.innerHTML = "";


  const keys =
    Object.keys(data);


  if(keys.length === 0){

    box.innerHTML =
      `<div class="empty">
        Bekleyen arkadaşlık isteği yok.
      </div>`;

    return;

  }


  keys.forEach(
    key => {

      const request =
        data[key];


      const div =
        document.createElement("div");

      div.className =
        "request";


      div.innerHTML = `

        <b>
          ${escapeHTML(request.username)}
        </b>

        <div class="listSub">
          Sana arkadaşlık isteği gönderdi.
        </div>

        <div class="requestButtons">

          <button
            class="accept"
            data-key="${escapeHTML(key)}"
          >
            Kabul Et
          </button>

          <button
            class="reject"
            data-key="${escapeHTML(key)}"
          >
            Reddet
          </button>

        </div>

      `;


      div
        .querySelector(".accept")
        .onclick =
          () => acceptRequest(key);


      div
        .querySelector(".reject")
        .onclick =
          () => rejectRequest(key);


      box.appendChild(div);

    }
  );

}


async function acceptRequest(otherKey){

  await update(
    ref(db),
    {

      [`friends/${meUser.usernameKey}/${otherKey}`]:
        true,

      [`friends/${otherKey}/${meUser.usernameKey}`]:
        true,

      [`friendRequests/${meUser.usernameKey}/${otherKey}`]:
        null

    }
  );

}


async function rejectRequest(otherKey){

  await remove(
    ref(
      db,
      `friendRequests/${meUser.usernameKey}/${otherKey}`
    )
  );

}


$("requestsButton").onclick =
  () => {

    $("requestsModal")
      .classList.remove("hidden");

  };


/* PRIVATE CHAT */

function privateId(a,b){

  return [
    a,
    b
  ]
  .sort()
  .join("_");

}


function openPrivate(
  userKey,
  user
){

  currentChat = {

    type:"private",

    id:privateId(
      meUser.usernameKey,
      userKey
    ),

    title:user.username,

    subtitle:
      user.online ?
      "Çevrimiçi" :
      "Çevrimdışı"

  };


  $("chatTitle").textContent =
    user.username;

  $("chatSub").textContent =
    currentChat.subtitle;

  $("chatAvatar").textContent =
    user.username
      .charAt(0)
      .toUpperCase();


  $("message").disabled =
    false;

  $("send").disabled =
    false;


  $("app").classList.add(
    "mobile-chat"
  );


  listenMessages();

}


/* GROUPS */

function loadGroups(){

  onValue(
    ref(db,"groups"),
    snapshot => {

      groups =
        snapshot.val() || {};

      renderGroups();

    }
  );

}


function renderGroups(){

  const box =
    $("groups");

  box.innerHTML = "";


  Object.entries(groups)
    .forEach(
      ([id,group]) => {

        if(
          !group.members ||
          !group.members[
            meUser.usernameKey
          ]
        ){

          return;

        }


        const item =
          document.createElement("div");

        item.className =
          "listItem";


        item.innerHTML = `

          <div class="listName">
            ${escapeHTML(group.name)}
          </div>

          <div class="listSub">
            Grup
          </div>

        `;


        item.onclick =
          () => openGroup(
            id,
            group
          );


        box.appendChild(item);

      }
    );

}


function renderGroupChoices(){

  const box =
    $("friendChoices");

  if(!box) return;

  box.innerHTML = "";


  Object.keys(friends)
    .forEach(
      key => {

        const user =
          users[key];

        if(!user) return;


        const div =
          document.createElement("div");

        div.className =
          "choice";


        div.innerHTML = `

          <label>

            <input
              type="checkbox"
              value="${escapeHTML(key)}"
            >

            ${escapeHTML(user.username)}

          </label>

        `;


        box.appendChild(div);

      }
    );

}


$("createGroup").onclick =
  () => {

    $("groupName").value = "";

    renderGroupChoices();

    $("groupModal")
      .classList.remove("hidden");

  };


$("makeGroup").onclick =
  async () => {

    try{

      const name =
        $("groupName")
          .value
          .trim();


      if(!name){

        alert(
          "Grup adı gir."
        );

        return;

      }


      const selected =
        Array.from(
          document.querySelectorAll(
            "#friendChoices input:checked"
          )
        )
        .map(
          input => input.value
        );


      const members = {

        [meUser.usernameKey]:
          true

      };


      selected.forEach(
        key => {

          members[key] =
            true;

        }
      );


      const groupRef =
        push(
          ref(db,"groups")
        );


      await set(
        groupRef,
        {

          name:name,

          owner:
            meUser.usernameKey,

          members:members,

          createdAt:
            Date.now()

        }
      );


      closeModal(
        "groupModal"
      );


      openGroup(
        groupRef.key,
        {
          name:name,
          owner:meUser.usernameKey,
          members:members
        }
      );


    }catch(error){

      console.error(error);

      alert(
        "Grup oluşturulamadı: " +
        error.message
      );

    }

  };


function openGroup(
  groupId,
  group
){

  currentChat = {

    type:"group",

    id:groupId,

    title:group.name,

    subtitle:"Grup sohbeti"

  };


  $("chatTitle").textContent =
    group.name;

  $("chatSub").textContent =
    "Grup sohbeti";

  $("chatAvatar").textContent =
    group.name
      .charAt(0)
      .toUpperCase();


  $("message").disabled =
    false;

  $("send").disabled =
    false;


  $("app").classList.add(
    "mobile-chat"
  );


  listenMessages();

}


/* MESSAGES */

function listenMessages(){

  if(messageListener){

    messageListener();

    messageListener = null;

  }


  $("messages").innerHTML = "";


  let messagesRef;


  if(
    currentChat.type ===
    "private"
  ){

    messagesRef =
      ref(
        db,
        `chats/${currentChat.id}/messages`
      );

  }else{

    messagesRef =
      ref(
        db,
        `groups/${currentChat.id}/messages`
      );

  }


  messageListener =
    onValue(
      messagesRef,
      snapshot => {

        const data =
          snapshot.val() || {};


        renderMessages(data);

      }
    );

}


function renderMessages(data){

  const box =
    $("messages");

  box.innerHTML = "";


  const entries =
    Object.entries(data)
      .sort(
        (a,b) =>
          (a[1].createdAt || 0) -
          (b[1].createdAt || 0)
      );


  if(entries.length === 0){

    box.innerHTML =
      `<div class="empty">
        Henüz mesaj yok.
      </div>`;

    return;

  }


  entries.forEach(
    ([id,msg]) => {

      const div =
        document.createElement("div");


      const mine =
        msg.senderId ===
        meUser.usernameKey;


      div.className =
        "message" +
        (mine ? " mine" : "");


      const date =
        msg.createdAt
          ? new Date(
              msg.createdAt
            ).toLocaleTimeString(
              "tr-TR",
              {
                hour:"2-digit",
                minute:"2-digit"
              }
            )
          : "";


      div.innerHTML = `

        <div class="messageSender">
          ${mine
            ? "Sen"
            : escapeHTML(
                msg.senderName || "Kullanıcı"
              )
          }
        </div>

        <div class="messageText">
          ${escapeHTML(msg.text)}
        </div>

        <div class="messageTime">
          ${date}
        </div>

      `;


      box.appendChild(div);

    }
  );


  box.scrollTop =
    box.scrollHeight;

}


/* SEND MESSAGE */

async function sendMessage(){

  const input =
    $("message");

  const text =
    input.value.trim();


  if(!text || !currentChat){

    return;

  }


  let messagesRef;


  if(
    currentChat.type ===
    "private"
  ){

    messagesRef =
      ref(
        db,
        `chats/${currentChat.id}/messages`
      );

  }else{

    messagesRef =
      ref(
        db,
        `groups/${currentChat.id}/messages`
      );

  }


  const newMessage =
    push(messagesRef);


  await set(
    newMessage,
    {

      senderId:
        meUser.usernameKey,

      senderName:
        meUser.username,

      text:text,

      createdAt:
        Date.now()

    }
  );


  input.value = "";

}


$("send").onclick =
  sendMessage;


$("message").addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* BACK */

$("back").onclick =
  () => {

    $("app")
      .classList.remove(
        "mobile-chat"
      );


    if(messageListener){

      messageListener();

      messageListener = null;

    }


    currentChat = null;


    $("message").disabled =
      true;

    $("send").disabled =
      true;


    $("chatTitle").textContent =
      "Sohbet seç";

    $("chatSub").textContent =
      "Bir arkadaş veya grup seç";


    $("messages").innerHTML =
      `<div class="empty">
        Bir sohbet seçerek başlayabilirsin.
      </div>`;

  };


/* LOGOUT */

$("logout").onclick =
  async () => {

    try{

      if(meUser){

        await update(
          ref(
            db,
            `users/${meUser.usernameKey}`
          ),
          {
            online:false
          }
        );

      }

    }catch(error){

      console.error(error);

    }


    localStorage.removeItem(
      "tsholick_user"
    );


    location.reload();

  };


/* MODAL */

window.closeModal =
  function(id){

    $(id)
      .classList.add("hidden");

  };


/* START */

checkSession();

</script>
